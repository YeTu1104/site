<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>叶荼的电脑</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  /* ---------- 像素字体（引用 UI 文件夹内的字体文件） ---------- */
  @font-face {
    font-family: "Nightgazer16";
    src: url('UI/Nightgazer16.ttf') format('truetype');
    font-display: swap;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1630;
    font-family: "Nightgazer16", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "SimHei", "Noto Sans CJK SC", sans-serif;
  }

  img {
    -webkit-user-drag: none;
    user-select: none;
    -webkit-user-select: none;
  }

  button {
    border: none;
    background: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    outline: none;
    font-family: inherit;
  }

  /* 设计画布：1376x768（背景图原始尺寸），整体缩放完整放入窗口 */
  #stage {
    position: fixed;
    left: 0;
    top: 0;
    width: 1376px;
    height: 768px;
    background: url('UI/动态背景.gif') no-repeat 0 0;
    background-size: 1376px 768px;
    transform-origin: 0 0;
  }

  /* ---------- 桌面图标 ---------- */
  .icon {
    position: absolute;
    width: 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: none;
    cursor: pointer;
  }
  .icon img {
    width: 64px;
    height: 64px;
    image-rendering: pixelated;
    display: block;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .icon .lbl {
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    text-shadow: 1px 1px 0 #4A4A6A, -1px 1px 0 #4A4A6A, 1px -1px 0 #4A4A6A, -1px -1px 0 #4A4A6A;
  }
  .icon:hover img { filter: brightness(1.14); transform: scale(1.18); }
  .icon:active img { transform: scale(1.18) translateY(2px); }
  a.icon { text-decoration: none; }

  /* ---------- 返回房间按钮 ---------- */
  #btnBack {
    position: absolute;
    left: 2px;
    top: 704px;
    width: 150px;
    height: 56px;
    padding: 0;
    background: #4A4A6A;
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    line-height: 52px;
    border: 2px solid #8a8ab8;
    box-shadow: inset -2px -2px 0 #2f2f4e, inset 2px 2px 0 #a0a0c8;
    cursor: pointer;
  }
  #btnBack:hover { background: #5a5a82; }
  #btnBack:active { box-shadow: inset 2px 2px 0 #2f2f4e, inset -2px -2px 0 #8a8ab8; }

  /* ---------- 鼠标粒子拖尾画布（覆盖在最上层，不阻挡点击） ---------- */
  #trail {
    position: absolute;
    left: 0;
    top: 0;
    width: 1376px;
    height: 768px;
    pointer-events: none;
    z-index: 60;
  }

  /* ---------- 弹出窗口 ---------- */
  #win {
    position: absolute;
    display: none;
    width: 320px;
    background: #F5E6D3;
    border: 2px solid #4A4A6A;
    box-shadow: inset -3px -3px 0 rgba(74, 74, 106, 0.28), inset 3px 3px 0 #fff7ec, 5px 5px 0 rgba(0, 0, 0, 0.25);
    transform-origin: top left;
    flex-direction: column;
  }

  #win.open {
    animation: winPop 0.26s ease-out;
  }
  @keyframes winPop {
    0%   { opacity: 0; transform: scale(0.72); }
    60%  { opacity: 1; transform: scale(1.04); }
    100% { opacity: 1; transform: scale(1); }
  }
  #winTitle {
    height: 32px;
    padding: 0 6px 0 10px;
    background: #4A4A6A;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: move;
    user-select: none;
    -webkit-user-select: none;
  }
  #winClose {
    flex: none;
    width: 24px;
    height: 24px;
    line-height: 24px;
    text-align: center;
    background: #C84A5A;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
  }
  #winClose:hover { background: #E06070; }
  #winBody {
    flex: 1 1 auto;
    min-height: 0;
    padding: 14px 16px;
    font-size: 15px;
    line-height: 1.75;
    color: #4b3a5a;
    max-height: 360px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #winFrame {
    flex: 1 1 auto;
    min-height: 0;
    border: none;
    display: none;
    width: 100%;
  }
</style>
</head>

  function openWin(iconEl, key) {
    playClick();
    var c = CONTENTS[key];
    winTitleText.textContent = c.title;

    if (c.src) {
      // iframe 内容页
      winBody.style.display = "none";
      winFrame.style.display = "block";
      winFrame.src = c.src;
      win.style.width = c.width + "px";
      win.style.height = c.height + "px";
    } else {
      // 纯文字内容
      winFrame.style.display = "none";
      winBody.style.display = "block";
      winBody.textContent = c.body;
      win.style.width = "320px";
      win.style.height = "auto";
    }

    win.style.display = "flex";

    // 紧贴图标右侧弹出（设计坐标系）
    var left = iconEl.offsetLeft + iconEl.offsetWidth + 12;
    var top = iconEl.offsetTop;
    var w = win.offsetWidth;
    var h = win.offsetHeight;
    left = Math.max(8, Math.min(DESIGN_W - w - 8, left));
    top = Math.max(8, Math.min(DESIGN_H - h - 8, top));
    win.style.left = left + "px";
    win.style.top = top + "px";
    win.style.zIndex = 20;

    // 重启动画，弹出时有缩放回弹的效果
    win.classList.remove("open");
    void win.offsetWidth;
    win.classList.add("open");
  }

  /* ========== 3. 点击图标打开窗口 ========== */
  var icons = document.querySelectorAll(".icon[data-win]");
  for (var i = 0; i < icons.length; i++) {
    icons[i].addEventListener("click", function () {
      openWin(this, this.getAttribute("data-win"));
    });
  }

  /* ========== 4. 关闭窗口 ========== */
  var closeBtn = document.getElementById("winClose");
  closeBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
  closeBtn.addEventListener("click", function () { playClick(); win.style.display = "none"; });

  /* ========== 5. 拖动标题栏 ========== */
  var titleBar = document.getElementById("winTitle");
  var dragging = false;
  var startX = 0, startY = 0, startLeft = 0, startTop = 0;

  titleBar.addEventListener("pointerdown", function (e) {
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;
    startLeft = win.offsetLeft;
    startTop = win.offsetTop;
    if (titleBar.setPointerCapture) { titleBar.setPointerCapture(e.pointerId); }
    e.preventDefault();
  });

  titleBar.addEventListener("pointermove", function (e) {
    if (!dragging) { return; }
    var dx = (e.clientX - startX) / scale;
    var dy = (e.clientY - startY) / scale;
    var left = Math.max(8, Math.min(DESIGN_W - win.offsetWidth - 8, startLeft + dx));
    var top = Math.max(8, Math.min(DESIGN_H - win.offsetHeight - 8, startTop + dy));
    win.style.left = left + "px";
    win.style.top = top + "px";
  });

  function endDrag(e) {
    dragging = false;
    if (titleBar.releasePointerCapture) {
      try { titleBar.releasePointerCapture(e.pointerId); } catch (err) {}
    }
  }
  titleBar.addEventListener("pointerup", endDrag);
  titleBar.addEventListener("pointercancel", endDrag);

  /* ========== 6. 音效 ========== */
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if (audioCtx.state === "suspended") { audioCtx.resume(); }
    return audioCtx;
  }
  function playClick() {
    try {
      var ctx = ensureAudio();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.connect(g);
      g.connect(ctx.destination);
      o.type = "square";
      var t = ctx.currentTime;
      o.frequency.value = 680;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      o.start(t);
      o.stop(t + 0.1);
    } catch (e) {}
  }

  /* ========== 7. 主页链接图标（点击直接跳转） ========== */
  var links = document.querySelectorAll("a.icon");
  for (var j = 0; j < links.length; j++) {
    links[j].addEventListener("click", function () { playClick(); });
  }

  /* ========== 8. 返回房间按钮 ========== */
  // 【填写网址的位置】 —— 把下面引号里的网址替换成“返回房间”要跳转到的地址
  var RETURN_URL = "../../index.html";
  var btnBack = document.getElementById("btnBack");
  btnBack.addEventListener("click", function () {
    playClick();
    if (RETURN_URL) { window.location.href = RETURN_URL; }
  });

  /* ========== 9. 鼠标粒子拖尾 ========== */
  var trail = document.getElementById("trail");
  var tctx = trail.getContext("2d");
  var particles = [];
  var TRAIL_COLORS = ["#ffe6a8", "#ffc8e8", "#c9b6ff", "#a8e0ff"];
  var lastX = -9999, lastY = -9999;

  function spawnParticle(x, y) {
    particles.push({
      x: x + (Math.random() - 0.5) * 7,
      y: y + (Math.random() - 0.5) * 7,
      vx: (Math.random() - 0.5) * 0.6,
      vy: (Math.random() - 0.5) * 0.6 - 0.22,
      size: 2 + Math.random() * 3,
      life: 1,
      decay: 0.028 + Math.random() * 0.022,
      color: TRAIL_COLORS[(Math.random() * TRAIL_COLORS.length) | 0]
    });
    if (particles.length > 130) { particles.splice(0, particles.length - 130); }
  }

  window.addEventListener("pointermove", function (e) {
    var rect = stage.getBoundingClientRect();
    var x = (e.clientX - rect.left) / scale;
    var y = (e.clientY - rect.top) / scale;
    var dx = x - lastX, dy = y - lastY;
    if (dx * dx + dy * dy < 16) { return; }
    lastX = x; lastY = y;
    spawnParticle(x, y);
    if (Math.random() < 0.45) { spawnParticle(x, y); }
  });

  var needsClear = false;
  function renderTrail() {
    if (particles.length === 0) {
      if (needsClear) { tctx.clearRect(0, 0, DESIGN_W, DESIGN_H); needsClear = false; }
      requestAnimationFrame(renderTrail);
      return;
    }
    tctx.clearRect(0, 0, DESIGN_W, DESIGN_H);
    tctx.globalCompositeOperation = "lighter";
    for (var k = particles.length - 1; k >= 0; k--) {
      var pt = particles[k];
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.012; pt.life -= pt.decay;
      if (pt.life <= 0) { particles.splice(k, 1); continue; }
      tctx.globalAlpha = pt.life * pt.life * 0.85;
      tctx.shadowBlur = 7; tctx.shadowColor = pt.color; tctx.fillStyle = pt.color;
      var s = pt.size * (0.35 + pt.life * 0.65);
      tctx.fillRect(pt.x - s / 2, pt.y - s / 2, s, s);
    }
    tctx.globalAlpha = 1; tctx.shadowBlur = 0; tctx.globalCompositeOperation = "source-over";
    needsClear = true;
    requestAnimationFrame(renderTrail);
  }
  renderTrail();

})();
</script>
</body>
</html>
