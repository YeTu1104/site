<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data: file:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" />
<title>我的像素生活板</title>
<style>
:root {
  color-scheme: light;
  --ink: #513923;
  --muted: #796044;
  --cream: #fff3d4;
  --wood-dark: #5e301d;
}

* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  color: var(--ink);
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  background: url("bg.png") center / 100% 100% no-repeat;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button, [role="button"] { -webkit-tap-highlight-color: transparent; }
button:focus-visible, [role="button"]:focus-visible,
input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 3px solid #164f62;
  outline-offset: 5px;
}
button:disabled { cursor: wait; opacity: .58; }
button {
  min-height: 42px;
  border: 2px solid #795033;
  border-radius: 3px;
  padding: 9px 15px;
  color: var(--ink);
  background: #fff0c9;
  box-shadow: 0 3px 0 #85532f;
  font-weight: 700;
}
button:hover { background: #fff8e6; }
button:active:not(:disabled) {
  translate: 0 2px;
  box-shadow: 0 1px 0 #85532f;
}
button.primary {
  color: #fff9e9;
  background: #577846;
  border-color: #374f2e;
  box-shadow: 0 3px 0 #354e2c;
}
button.primary:hover { background: #668853; }
button.subtle { background: #f4dfb7; }
button.small { padding: 7px 11px; font-size: 13px; }
.page {
  min-width: 820px;
  height: 100vh;
  height: 100dvh;
  padding: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.board {
  position: absolute;
  inset: 11% 14% 17% 14%;
  display: grid;
  grid-template-columns: minmax(190px, 27fr) minmax(440px, 73fr);
  gap: 18px;
  isolation: isolate;
  padding: clamp(30px, 3vw, 48px);
  overflow: hidden;
}
.sidebar {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 25px;
  padding: 9px 0 16px;
  min-width: 0;
}
.info-slot { width: 100%; display: flex; justify-content: flex-start; }
.info-item {
  cursor: pointer;
  flex-shrink: 0;
  position: relative;
  user-select: none;
}
.lift {
  transition: transform 360ms cubic-bezier(.22, 1.5, .45, 1),
              filter 360ms ease;
  transform-origin: center;
}
@media (hover: hover) {
  .info-item:hover {
    transform: scale(1.035) rotate(-1deg);
    filter: drop-shadow(0 6px 3px #4d2b2140);
  }
  .note:hover .note-paper {
    transform: scale(1.04) rotate(1.3deg);
  }
}
.schedule {
  position: relative;
  width: min(100%, 280px, calc((72vh - 150px) * .45));
  aspect-ratio: 370 / 490;
  background: #fff0c9;
  border: 3px solid #78502d;
  box-shadow: 4px 5px 0 #67422266, inset 0 0 23px #c4913a22;
}
.schedule::after {
  content: "";
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, transparent 44%, #b68d55 45% 52%, #ead3a2 53%);
  pointer-events: none;
}
.schedule.imported {
  background: transparent;
  border: 0;
  box-shadow: none;
  filter: drop-shadow(3px 5px 1px #4a2b2455);
}
.schedule.imported::after { display: none; }
.schedule > img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  image-rendering: pixelated;
  pointer-events: none;
}
.schedule-title {
  position: absolute;
  top: 4%;
  left: 9%;
  right: 9%;
  margin: 0;
  padding: 0 0 7px;
  border-bottom: 3px solid #513e28;
  text-align: center;
  font-size: 23px;
  letter-spacing: 2px;
}
.schedule-lines {
  position: absolute;
  top: 24%;
  left: 10%;
  right: 9%;
  bottom: 12%;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 15px;
  font-size: 13px;
  line-height: 1.75;
}
.schedule-lines p { margin: 0; }
.schedule-lines b { color: #805633; font-size: .88em; display: block; }
.schedule-foot {
  margin-top: auto !important;
  font-size: .83em;
  color: #967451;
  text-align: center;
}
.calendar {
  width: min(100%, 250px, calc((72vh - 150px) * .4));
  aspect-ratio: 1;
  padding: 10px;
  border: 4px solid #36312d;
  outline: 2px solid #ede5d2;
  background: #fffcf3;
  box-shadow: 4px 5px 0 #4d2e2855;
  display: flex;
  flex-direction: column;
  color: #353132;
}
.calendar.imported { padding: 0; border: 0; outline: 0; background: transparent; }
.calendar img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  image-rendering: pixelated;
  pointer-events: none;
}
.calendar-title {
  font-family: Consolas, "Courier New", monospace;
  font-size: 19px;
  font-weight: 900;
  text-align: center;
  border-bottom: 3px solid #36312d;
  margin: 0 0 6px;
  padding-bottom: 5px;
}
.calendar-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-template-rows: 18px repeat(5, 1fr);
  gap: 2px;
}
.calendar-grid span {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #a9a5a4;
  font-family: Consolas, "Courier New", monospace;
  font-weight: 700;
  font-size: 16px;
}
.calendar-grid .weekday { font-size: 9px; border: 0; }
.calendar-grid .busy {
  background: #c94f45;
  color: #fffdf2;
  border-color: #8f3229;
}
.calendar-grid .free {
  background: #6f9c55;
  color: #fffdf2;
  border-color: #4c7238;
}
.calendar-legend {
  margin: 0;
  padding-top: 6px;
  border-top: 1px dashed #a9a5a4;
  font-size: 10px;
  text-align: center;
  color: #6b5f52;
}
.workspace {
  display: grid;
  grid-template-rows: minmax(0, 1fr);
  gap: 16px;
  min-width: 0;
  isolation: isolate;
}
.canvas {
  min-width: 0;
  min-height: 240px;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  border: 1px dashed #ffdfa62e;
  border-radius: 5px;
  background: #5b301006;
}
.polaroid {
  --pin: #d8433a;
  position: absolute;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  display: flex;
  flex-direction: column;
  padding: 10px 10px 14px;
  border: 2px solid #cfc3ae;
  background: #fbf6ea;
  box-shadow: 3px 4px 0 #57362733, 5px 9px 10px #49291624;
  transform: rotate(1.5deg);
}
.polaroid::before {
  content: "";
  position: absolute;
  z-index: 3;
  left: calc(50% - 8px);
  top: -17px;
  width: 15px;
  height: 19px;
  background: var(--pin);
  border: 2px solid #7c2119;
  border-radius: 50% / 60% 60% 40% 40%;
  box-shadow:
    inset 3px 3px 0 #ffffff6b,
    inset -2px -3px 0 #3c231c33,
    -3px 4px 0 #69453666;
}
.polaroid-photo {
  aspect-ratio: 3 / 4;
  width: 100%;
  flex-shrink: 0;
  border: 2px solid #cfc3ae;
  background: #efe8da;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #b3a58c;
  font-size: 12px;
  letter-spacing: 2px;
  text-align: center;
  white-space: pre-line;
}
.polaroid-caption {
  margin: 10px 0 0;
  height: 36px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 700;
  color: #4e392d;
}
.polaroid.dragging { cursor: grabbing; transform: none; }
.polaroid:focus-visible { outline-offset: 6px; }
.note {
  position: absolute;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.note:focus-visible { outline-offset: 10px; }
.paper {
  --paper: #ffe58d;
  --edge: #ab773a;
  --pin: #ca674d;
  position: relative;
  border: 2px solid var(--edge);
  color: #4e392d;
  background:
    repeating-linear-gradient(0deg, transparent 0 5px, #ffffff0d 5px 6px),
    linear-gradient(120deg, #ffffff28, transparent 65%),
    var(--paper);
  box-shadow: 3px 4px 0 #57362755, 5px 9px 10px #49291624;
}
.paper::before {
  content: "";
  position: absolute;
  z-index: 2;
  left: calc(50% - 8px);
  top: -12px;
  width: 15px;
  height: 19px;
  background: var(--pin);
  border: 2px solid #633c31;
  box-shadow:
    inset 3px 3px 0 #ffffff6b,
    inset -2px -3px 0 #3c231c33,
    -3px 4px 0 #69453666;
}
.paper::after {
  content: "";
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 24px;
  height: 24px;
  background: linear-gradient(135deg, transparent 46%, var(--edge) 47% 53%, #fff5ce 54%);
  pointer-events: none;
}
.note-paper {
  width: 100%;
  height: 100%;
  padding: 25px 17px 19px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transform: rotate(var(--tilt, -1deg));
  transition: transform 360ms cubic-bezier(.22, 1.5, .45, 1),
              box-shadow 220ms ease;
}
.note.dragging { cursor: grabbing; }
.note.dragging .note-paper {
  transform: none;
  transition: none;
  box-shadow: 5px 7px 0 #57362744, 9px 16px 15px #49291655;
}
.note-kicker {
  font-size: 9px;
  font-family: Consolas, monospace;
  letter-spacing: 2px;
  color: #66452cb8;
}
.note-text {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.75;
  font-size: 16px;
}
.note .note-text {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
}
.note-bottom {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  gap: 5px;
  font-size: 10px;
  color: #715537;
}
.pixel-heart { font-family: Consolas, monospace; font-size: 13px; }
.toast {
  position: fixed;
  z-index: 999999;
  bottom: 23px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 21px;
  max-width: calc(100vw - 32px);
  color: #fff8e3;
  background: #493422;
  border: 2px solid #edc98d;
  box-shadow: 4px 4px 0 #2d201a55;
  font-size: 14px;
  pointer-events: none;
}
.toast:empty { display: none; }
body.modal-open { overflow: hidden; }
dialog {
  width: min(650px, calc(100vw - 28px));
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px);
  padding: 0;
  margin: auto;
  color: var(--ink);
  background: transparent;
  border: none;
  overflow: hidden;
}
dialog[open] {
  display: flex;
  flex-direction: column;
  animation: appear 200ms ease-out;
}
dialog::backdrop {
  background: #281c17b5;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}
@keyframes appear {
  from { opacity: 0; transform: scale(.96); }
  to { opacity: 1; transform: scale(1); }
}
.dialog-body {
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  padding: 25px;
}
dialog.no-scroll .dialog-body { overflow: hidden; }
.view-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 13px 9px 14px;
}
.view-wrap .schedule { width: min(380px, 100%); }
.view-wrap .schedule-title { font-size: clamp(23px, 6vw, 35px); }
.view-wrap .schedule-lines { font-size: clamp(13px, 3.8vw, 19px); gap: 18px; }
.view-wrap .calendar { width: min(440px, 100%); }
.view-wrap .calendar-title { font-size: clamp(20px, 6vw, 35px); }
.view-wrap .calendar-grid { grid-template-rows: 26px repeat(5, 1fr); }
.view-wrap .calendar-grid span { font-size: clamp(16px, 4.5vw, 30px); }
.view-wrap .calendar-grid .weekday { font-size: clamp(9px, 2.4vw, 14px); }
.view-caption { margin: 20px 0 0; text-align: center; font-size: 12px; color: var(--muted); }
.flip-scene { perspective: 1400px; width: min(320px, 100%); margin: 0 auto; }
.flip-card {
  position: relative;
  display: grid;
  transform-style: preserve-3d;
  transition: transform 640ms cubic-bezier(.4, .1, .2, 1);
}
.flip-card.flipped { transform: rotateY(180deg); }
.flip-face {
  grid-area: 1 / 1;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.polaroid-static { position: static; transform: none; width: 100%; }
.flip-back {
  transform: rotateY(180deg);
  min-height: 330px;
  padding: 26px 24px;
  border: 3px solid #cfc3ae;
  background: #fbf6ea;
  box-shadow: inset 0 0 0 6px #f1e8d5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  text-align: center;
  color: #4e392d;
}
.flip-back h3 { margin: 0; font-size: 20px; }
.flip-back p { margin: 0; line-height: 1.9; font-size: 15px; color: #6b573f; white-space: pre-wrap; overflow-wrap: anywhere; }
.flip-back .flip-hint { font-size: 12px; color: #9a8a72; }
.flip-back a {
  display: inline-block;
  margin-top: 4px;
  padding: 10px 18px;
  border: 2px solid #967149;
  border-radius: 3px;
  background: #fff0c9;
  color: #513923;
  font-weight: 700;
  text-decoration: none;
}
.flip-back a:hover { background: #fff8e6; }
.flip-scene .polaroid-photo { font-size: 16px; }
.big-note {
  width: min(460px, 100%);
  min-height: 280px;
  padding: 40px 29px 32px;
}
.big-note .note-text { font-size: 20px; line-height: 1.9; margin: 20px 0 25px; }
.big-note .note-bottom { font-size: 12px; }
.field-label { display: block; font-weight: 700; margin: 0 0 10px; }
textarea {
  width: 100%;
  min-height: 175px;
  resize: vertical;
  border: 2px solid #b59466;
  border-radius: 3px;
  padding: 13px;
  line-height: 1.8;
  color: var(--ink);
  background: #fffaf0;
}
.counter-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  font-size: 12px;
  margin: 6px 0 22px;
  color: var(--muted);
}
.form-error { color: #a0342a; min-height: 20px; font-size: 13px; margin: 12px 0; }
.color-options {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin: 0;
  padding: 0;
  border: 0;
}
.color-options legend { margin-bottom: 12px; font-weight: 700; }
.color-option {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 9px;
  border: 2px solid #bc9b75;
  cursor: pointer;
  font-size: 13px;
}
.color-option input { accent-color: #5e7345; }
.form-actions { display: flex; justify-content: flex-end; gap: 11px; margin-top: 20px; }
.material-intro { margin: 0 0 19px; font-size: 13px; line-height: 1.8; color: var(--muted); }
.material-block {
  border: 2px dashed #cfaf7e;
  padding: 16px;
  margin-bottom: 15px;
  background: #fff9eb88;
}
.material-block h3 { font-size: 15px; margin: 0 0 8px; }
.material-block p { font-size: 12px; line-height: 1.75; color: var(--muted); margin: 8px 0; }
.material-block input[type="file"] { width: 100%; font-size: 12px; margin-top: 8px; }
.material-block input::file-selector-button {
  padding: 8px;
  margin-right: 8px;
  border: 1px solid #967149;
  background: #f5dfb8;
  color: #513923;
  cursor: pointer;
}
.material-preview {
  display: block;
  max-width: 100%;
  max-height: 160px;
  margin: 13px auto 0;
  object-fit: contain;
  image-rendering: pixelated;
  background:
    conic-gradient(#eadbc3 25%, #f9f0df 0 50%, #eadbc3 0 75%, #f9f0df 0) 0 0 / 12px 12px;
}
.material-preview:not([src]) { display: none; }
.material-status { min-height: 18px; }
.material-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 12px; }
.check-label { font-size: 12px; line-height: 1.8; }
.material-controls button { min-height: 32px; font-size: 12px; padding: 5px 9px; }
.notice {
  padding: 11px 13px;
  background: #e9efd4;
  border-left: 3px solid #6f8749;
  font-size: 12px;
  line-height: 1.8;
}
@media (max-width: 1000px) {
  .page { padding: 0; }
  .board { padding: 34px; gap: 19px; }
  .sidebar { padding-left: 0; padding-right: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
  .info-item:hover, .note:hover .note-paper { transform: none; }
}
</style>
</head>
<body>
<div class="page">
  <main class="board" id="board" aria-label="个人木质公告栏">
    <aside class="sidebar" aria-label="固定信息栏">
      <div class="info-slot" id="scheduleSlot"></div>
      <div class="info-slot" id="calendarSlot"></div>
    </aside>

    <section class="workspace" aria-label="彩色便签区">
      <div class="canvas" id="canvas" aria-label="便签拖拽画布"></div>
    </section>
  </main>
</div>

<dialog id="modal">
  <div class="dialog-body" id="modalBody"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="application/json" id="board-data">
{
  "version": 1,
  "assets": {
    "schedule": "",
    "calendar": ""
  },
  "canvasMinHeight": 240,
  "notes": [
    {"id":"seed1","text":"今天也要\n好好吃饭","color":"pink","u":null,"v":null,"z":1},
    {"id":"seed2","text":"给自己留一点\n发呆时间","color":"blue","u":null,"v":null,"z":2},
    {"id":"seed3","text":"想做的事：\n种一盆小植物","color":"yellow","u":null,"v":null,"z":3},
    {"id":"seed4","text":"周末去散步\n捡一片好看的叶子","color":"green","u":null,"v":null,"z":4},
    {"id":"seed5","text":"灵感收集箱\n小小想法也值得被记住","color":"cream","u":null,"v":null,"z":5},
    {"id":"seed6","text":"慢慢来，\n也很好","color":"pink","u":null,"v":null,"z":6}
  ],
  "polaroid": { "u": 0.8, "v": 0.55, "z": 10 }
}
</script>

<script>
(function () {
  "use strict";

  const $ = id => document.getElementById(id);
  const board = $("board");
  const canvas = $("canvas");
  const dialog = $("modal");
  const modalBody = $("modalBody");
  const PAD = 26;
  const COLORS = {
    pink:   { name: "粉色",   paper: "#f6b9bd", edge: "#ad6570", pin: "#6795ba" },
    blue:   { name: "浅蓝",   paper: "#b9def0", edge: "#6286a6", pin: "#cb6951" },
    yellow: { name: "鹅黄",   paper: "#ffe88f", edge: "#ae8239", pin: "#6f9c55" },
    green:  { name: "浅绿",   paper: "#cfe898", edge: "#809c48", pin: "#5c8fb9" },
    cream:  { name: "奶油色", paper: "#f9e9c9", edge: "#b39878", pin: "#cf9857" }
  };

  // 【忙碌闲暇表】标记日历中的忙碌与闲暇天数，修改下面的数字即可调整变色日期。
  // busy  = 忙碌日期，格子显示红色；free = 闲暇日期，格子显示绿色。
  // 数字 1~30 对应日历中的 1 号~30 号。
  const busyFree = {
    busy: [3, 8, 12, 19, 25],
    free: [5, 14, 21, 27]
  };

  // 【拍立得】钉在便签区的红点头照片，可以拖动，点击放大后 0.5 秒翻到背面。
  // name  = 照片下方显示的名字；intro = 背面的文字介绍；url = 背面的自定义网址链接。
  // 照片图片暂时不齐全，正面先用 3:4 的占位区间，将来补充后再替换这里。
  const polaroidData = {
    name: "我的拍立得",
    intro: "写下关于这张照片的介绍吧。\n例如：拍摄的时间、地点，或一句想说的话。",
    url: "https://example.com"
  };

  let state = JSON.parse($("board-data").textContent);
  const views = new Map();
  let active = null;
  let layoutFrame = 0;
  let lastWidth = -1;
  let lastHeight = -1;
  let previousFocus = null;
  let toastTimer;
  let highestZ = Math.max(0, ...state.notes.map(n => n.z || 0), (state.polaroid && state.polaroid.z) || 0);

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function button(text, className, handler) {
    const b = el("button", className, text);
    b.type = "button";
    if (handler) b.addEventListener("click", handler);
    return b;
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(Math.max(min, max), value));
  }

  function toast(message) {
    clearTimeout(toastTimer);
    $("toast").textContent = message;
    toastTimer = setTimeout(() => { $("toast").textContent = ""; }, 4200);
  }

  function paintPaper(node, color) {
    const c = COLORS[color] || COLORS.yellow;
    node.style.setProperty("--paper", c.paper);
    node.style.setProperty("--edge", c.edge);
    node.style.setProperty("--pin", c.pin);
  }

  function localImage(data, alt) {
    const img = new Image();
    img.src = data;
    img.alt = alt;
    img.draggable = false;
    return img;
  }

  function makeSchedule() {
    const imported = Boolean(state.assets.schedule);
    const sheet = el("div", "schedule" + (imported ? " imported" : ""));
    if (imported) {
      const img = localImage(state.assets.schedule, "从素材 B 单独裁切的本周日程纸张");
      img.addEventListener("load", () => {
        sheet.style.aspectRatio = img.naturalWidth + " / " + img.naturalHeight;
      });
      sheet.append(img);
    } else {
      sheet.append(el("h2", "schedule-title", "本周日程"));
    }

    const lines = el("div", "schedule-lines");
    [
      ["周一 MON", "整理本周计划"],
      ["周三 WED", "给植物浇水"],
      ["周五 FRI", "完成一个小目标"],
      ["周日 SUN", "休息与散步"]
    ].forEach(([day, text]) => {
      const p = el("p");
      p.append(el("b", "", day), document.createTextNode(text));
      lines.append(p);
    });
    lines.append(el("p", "schedule-foot", "一件一件，慢慢完成。"));
    sheet.append(lines);
    return sheet;
  }

  function makeCalendar() {
    const sheet = el("div", "calendar" + (state.assets.calendar ? " imported" : ""));
    if (state.assets.calendar) {
      const img = localImage(state.assets.calendar, "静态装饰月历，不代表当前月份");
      img.addEventListener("load", () => {
        sheet.style.aspectRatio = img.naturalWidth + " / " + img.naturalHeight;
      });
      sheet.append(img);
    } else {
      sheet.append(el("div", "calendar-title", "MONTH: XXXX"));
      const grid = el("div", "calendar-grid");
      ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"].forEach(day => {
        grid.append(el("span", "weekday", day));
      });
      for (let i = 0; i < 35; i++) {
        const day = i - 2;
        const mark = busyFree.busy.includes(day) ? " busy" : (busyFree.free.includes(day) ? " free" : "");
        grid.append(el("span", mark, day >= 1 && day <= 30 ? String(day) : ""));
      }
      sheet.append(grid);
      sheet.append(el("p", "calendar-legend", "【忙碌闲暇表】红＝忙碌 · 绿＝闲暇"));
    }
    return sheet;
  }

  function activateInfo(node, kind, label) {
    node.classList.add("info-item", "lift");
    node.tabIndex = 0;
    node.setAttribute("role", "button");
    node.setAttribute("aria-label", label + "，点击放大");
    node.addEventListener("click", () => showInfo(kind, node));
    node.addEventListener("keydown", e => {
      if ((e.key === "Enter" || e.key === " ") && !e.repeat) {
        e.preventDefault();
        showInfo(kind, node);
      }
    });
  }

  function applyAssets() {
    const schedule = makeSchedule();
    const calendar = makeCalendar();
    activateInfo(schedule, "schedule", "本周日程");
    activateInfo(calendar, "calendar", "静态月历");
    $("scheduleSlot").replaceChildren(schedule);
    $("calendarSlot").replaceChildren(calendar);
    queueLayout();
  }

  function fillNote(paper, note, full) {
    paintPaper(paper, note.color);
    paper.append(el("div", "note-kicker", "A LITTLE NOTE"));
    paper.append(el("p", "note-text", note.text));
    const bottom = el("div", "note-bottom");
    bottom.append(
      el("span", "", full ? "好好收藏这一刻" : "生活的小碎片"),
      el("span", "pixel-heart", "♡")
    );
    paper.append(bottom);
  }

  function openModal(title, content, origin, initialFocus) {
    if (dialog.open) return;
    if (active) finishGesture(false);
    previousFocus = origin || document.activeElement;
    modalBody.replaceChildren(content);
    modalBody.scrollTop = 0;
    document.body.classList.add("modal-open");
    dialog.showModal();
    if (initialFocus) initialFocus.focus({ preventScroll: true });
  }

  function closeModal() {
    if (dialog.open) dialog.close();
  }

  dialog.addEventListener("cancel", e => {
    e.preventDefault();
    requestClose();
  });
  dialog.addEventListener("close", () => {
    document.body.classList.remove("modal-open");
    dialog.classList.remove("no-scroll");
    polaroidModalActive = false;
    polaroidClosing = false;
    polaroidSide = "front";
    polaroidCardEl = null;
    clearTimeout(polaroidFlipTimer);
    clearTimeout(polaroidCloseTimer);
    const target = previousFocus;
    previousFocus = null;
    if (target && target.isConnected) target.focus({ preventScroll: true });
  });

  function outsideDialog(e) {
    const r = dialog.getBoundingClientRect();
    return e.clientX < r.left || e.clientX > r.right ||
           e.clientY < r.top || e.clientY > r.bottom;
  }
  let backdropDown = false;
  dialog.addEventListener("pointerdown", e => {
    backdropDown = e.target === dialog && outsideDialog(e);
  });
  dialog.addEventListener("click", e => {
    if (backdropDown && e.target === dialog && outsideDialog(e)) requestClose();
    backdropDown = false;
  });

  function showInfo(kind, origin) {
    const wrap = el("div", "view-wrap");
    wrap.append(kind === "schedule" ? makeSchedule() : makeCalendar());
    openModal(kind === "schedule" ? "本周日程" : "月历 · 静态装饰", wrap, origin);
  }

  function showNote(note, origin) {
    const wrap = el("div", "view-wrap");
    const paper = el("article", "paper big-note");
    fillNote(paper, note, true);
    wrap.append(paper);
    openModal("一张生活碎片", wrap, origin);
  }

  function dimensions() {
    const cw = canvas.clientWidth;
    const ch = canvas.clientHeight;
    // 最窄的画布也为纸片、图钉和悬停动画留出空间。
    const pad = Math.min(PAD, cw / 8, ch / 8);
    const width = Math.max(1, Math.min(194, (cw - pad * 3) / 2, cw - pad * 2));
    const height = Math.max(1, Math.min(174, (ch - pad * 4) / 3, ch - pad * 2));
    const pWidth = Math.max(1, Math.min(140, cw - pad * 2));
    const pHeight = Math.round(74 + (pWidth - 24) * 4 / 3);
    return {
      cw, ch, pad, width, height,
      pWidth, pHeight,
      spanX: Math.max(0, cw - pad * 2 - width),
      spanY: Math.max(0, ch - pad * 2 - height),
      pSpanX: Math.max(0, cw - pad * 2 - pWidth),
      pSpanY: Math.max(0, ch - pad * 2 - pHeight)
    };
  }

  function normalizeInitialPositions(d) {
    const pending = state.notes.filter(n => n.u === null || n.v === null);
    if (!pending.length) return;
    const cols = Math.max(1, Math.floor((d.cw - d.pad * 2 + 24) / (d.width + 24)));
    const rows = Math.max(1, Math.ceil(state.notes.length / cols));
    state.notes.forEach((n, index) => {
      if (n.u !== null && n.v !== null) return;
      const col = index % cols;
      const row = Math.floor(index / cols);
      n.u = cols === 1 ? .5 : col / (cols - 1);
      n.v = rows === 1 ? .45 : row / (rows - 1);
      // 轻微错落，保留足够行列间距。
      if (n.u > 0 && n.u < 1) n.u = clamp(n.u + (index % 2 ? .012 : -.012), 0, 1);
      if (n.v > 0 && n.v < 1) n.v = clamp(n.v + (index % 2 ? .014 : -.014), 0, 1);
    });
  }

  function positionNote(note, view, d) {
    note.u = clamp(Number.isFinite(note.u) ? note.u : .5, 0, 1);
    note.v = clamp(Number.isFinite(note.v) ? note.v : .5, 0, 1);
    view.x = d.pad + note.u * d.spanX;
    view.y = d.pad + note.v * d.spanY;
    view.node.style.width = d.width + "px";
    view.node.style.height = d.height + "px";
    view.node.style.left = view.x + "px";
    view.node.style.top = view.y + "px";
    view.node.style.zIndex = String(note.z || 1);
  }

  function layout() {
    layoutFrame = 0;
    const d = dimensions();
    if (!d.cw || !d.ch) return;
    if (d.cw !== lastWidth || d.ch !== lastHeight) {
      finishGesture(false);
      finishPolaroidGesture(false);
    }
    lastWidth = d.cw;
    lastHeight = d.ch;
    normalizeInitialPositions(d);
    state.notes.forEach(note => {
      const view = views.get(note.id);
      if (view) positionNote(note, view, d);
    });
    if (polaroidView) positionPolaroid(state.polaroid, polaroidView, d);
  }

  function queueLayout() {
    if (!layoutFrame) layoutFrame = requestAnimationFrame(layout);
  }

  function bringToFront(note, node) {
    // 防止长时间操作后 z-index 无限增长。
    if (highestZ > 100000) {
      [...state.notes].sort((a, b) => a.z - b.z).forEach((n, index) => {
        n.z = index + 1;
        const view = views.get(n.id);
        if (view) view.node.style.zIndex = String(n.z);
      });
      highestZ = state.notes.length;
    }
    note.z = ++highestZ;
    node.style.zIndex = String(note.z);
  }

  function startGesture(e, note, view) {
    if (dialog.open || active || !e.isPrimary || e.button !== 0) return;
    e.preventDefault();
    view.node.focus({ preventScroll: true });
    bringToFront(note, view.node);
    active = {
      pointerId: e.pointerId,
      note, view,
      pointerX: e.clientX,
      pointerY: e.clientY,
      startX: view.x,
      startY: view.y,
      moved: false
    };
    try {
      view.node.setPointerCapture(e.pointerId);
    } catch (error) {
      active = null;
    }
  }

  function moveGesture(e) {
    const a = active;
    if (!a || e.pointerId !== a.pointerId) return;
    // 检查合并的 Pointer Events，避免快速移出又移回被误判为点击。
    let samples = [e];
    if (typeof e.getCoalescedEvents === "function") {
      const coalesced = e.getCoalescedEvents();
      if (coalesced.length) samples = coalesced.concat(e);
    }
    for (const sample of samples) {
      if (Math.hypot(sample.clientX - a.pointerX, sample.clientY - a.pointerY) > 6) {
        a.moved = true;
      }
    }
    if (!a.moved) return;
    if (e.cancelable) e.preventDefault();
    a.view.node.classList.add("dragging");
    const d = dimensions();
    const x = clamp(a.startX + e.clientX - a.pointerX, d.pad, d.pad + d.spanX);
    const y = clamp(a.startY + e.clientY - a.pointerY, d.pad, d.pad + d.spanY);
    a.note.u = d.spanX ? (x - d.pad) / d.spanX : .5;
    a.note.v = d.spanY ? (y - d.pad) / d.spanY : .5;
    positionNote(a.note, a.view, d);
  }

  function finishGesture(allowClick) {
    const a = active;
    if (!a) return;
    active = null;
    a.view.node.classList.remove("dragging");
    try {
      if (a.view.node.hasPointerCapture(a.pointerId)) {
        a.view.node.releasePointerCapture(a.pointerId);
      }
    } catch (error) {
      // 指针可能已由浏览器自动释放。
    }
    if (allowClick && !a.moved) showNote(a.note, a.view.node);
  }

  function mountNote(note, index) {
    const node = el("div", "note");
    node.tabIndex = 0;
    node.setAttribute("role", "button");
    node.setAttribute("aria-label", "便签：" + note.text + "。按 Enter 放大，方向键移动。");
    node.setAttribute("aria-haspopup", "dialog");
    const paper = el("div", "paper note-paper");
    paper.style.setProperty("--tilt", (index % 2 ? 1 : -1.1) + "deg");
    fillNote(paper, note, false);
    node.append(paper);
    const view = { node, x: 0, y: 0 };
    views.set(note.id, view);

    node.addEventListener("pointerdown", e => startGesture(e, note, view));
    node.addEventListener("pointermove", moveGesture);
    node.addEventListener("pointerup", e => {
      if (!active || active.pointerId !== e.pointerId) return;
      moveGesture(e);
      finishGesture(true);
    });
    node.addEventListener("pointercancel", e => {
      if (active && active.pointerId === e.pointerId) finishGesture(false);
    });
    node.addEventListener("lostpointercapture", e => {
      if (active && active.pointerId === e.pointerId) finishGesture(false);
    });
    // 鼠标/触摸打开只由 pointerup 决定，绝不使用浏览器后续 click 打开放大。
    node.addEventListener("click", e => e.preventDefault());
    node.addEventListener("keydown", e => {
      if (dialog.open || active) return;
      if ((e.key === "Enter" || e.key === " ") && !e.repeat) {
        e.preventDefault();
        showNote(note, node);
        return;
      }
      const keys = {
        ArrowLeft: [-1, 0], ArrowRight: [1, 0],
        ArrowUp: [0, -1], ArrowDown: [0, 1]
      };
      if (!keys[e.key]) return;
      e.preventDefault();
      const d = dimensions();
      const step = e.shiftKey ? 20 : 8;
      const [dx, dy] = keys[e.key];
      note.u = d.spanX ? clamp(note.u + dx * step / d.spanX, 0, 1) : .5;
      note.v = d.spanY ? clamp(note.v + dy * step / d.spanY, 0, 1) : .5;
      bringToFront(note, node);
      positionNote(note, view, d);
    });
    canvas.append(node);
  }

  let polaroidView = null;
  let polaroidActive = null;
  let polaroidSide = "front";
  let polaroidModalActive = false;
  let polaroidClosing = false;
  let polaroidCardEl = null;
  let polaroidFlipTimer = 0;
  let polaroidCloseTimer = 0;

  function positionPolaroid(p, view, d) {
    p.u = clamp(Number.isFinite(p.u) ? p.u : .5, 0, 1);
    p.v = clamp(Number.isFinite(p.v) ? p.v : .5, 0, 1);
    view.x = d.pad + p.u * d.pSpanX;
    view.y = d.pad + p.v * d.pSpanY;
    view.node.style.width = d.pWidth + "px";
    view.node.style.height = d.pHeight + "px";
    view.node.style.left = view.x + "px";
    view.node.style.top = view.y + "px";
    view.node.style.zIndex = String(p.z || 1);
  }

  function makePolaroidNode() {
    const node = el("div", "polaroid");
    node.tabIndex = 0;
    node.setAttribute("role", "button");
    node.setAttribute("aria-label", "拍立得照片，点击放大查看");
    node.setAttribute("aria-haspopup", "dialog");
    node.append(
      el("div", "polaroid-photo", "3:4 照片占位\n图片待补充"),
      el("div", "polaroid-caption", polaroidData.name)
    );
    return node;
  }

  function startPolaroidGesture(e, p, view) {
    if (dialog.open || polaroidActive || active || !e.isPrimary || e.button !== 0) return;
    e.preventDefault();
    view.node.focus({ preventScroll: true });
    p.z = ++highestZ;
    view.node.style.zIndex = String(p.z);
    polaroidActive = {
      pointerId: e.pointerId,
      p, view,
      pointerX: e.clientX,
      pointerY: e.clientY,
      startX: view.x,
      startY: view.y,
      moved: false
    };
    try {
      view.node.setPointerCapture(e.pointerId);
    } catch (error) {
      polaroidActive = null;
    }
  }

  function movePolaroidGesture(e) {
    const a = polaroidActive;
    if (!a || e.pointerId !== a.pointerId) return;
    let samples = [e];
    if (typeof e.getCoalescedEvents === "function") {
      const coalesced = e.getCoalescedEvents();
      if (coalesced.length) samples = coalesced.concat(e);
    }
    for (const sample of samples) {
      if (Math.hypot(sample.clientX - a.pointerX, sample.clientY - a.pointerY) > 6) a.moved = true;
    }
    if (!a.moved) return;
    if (e.cancelable) e.preventDefault();
    a.view.node.classList.add("dragging");
    const d = dimensions();
    const x = clamp(a.startX + e.clientX - a.pointerX, d.pad, d.pad + d.pSpanX);
    const y = clamp(a.startY + e.clientY - a.pointerY, d.pad, d.pad + d.pSpanY);
    a.p.u = d.pSpanX ? (x - d.pad) / d.pSpanX : .5;
    a.p.v = d.pSpanY ? (y - d.pad) / d.pSpanY : .5;
    positionPolaroid(a.p, a.view, d);
  }

  function finishPolaroidGesture(allowClick) {
    const a = polaroidActive;
    if (!a) return;
    polaroidActive = null;
    a.view.node.classList.remove("dragging");
    try {
      if (a.view.node.hasPointerCapture(a.pointerId)) a.view.node.releasePointerCapture(a.pointerId);
    } catch (error) {
      // 指针可能已由浏览器自动释放。
    }
    if (allowClick && !a.moved) showPolaroid();
  }

  function mountPolaroid() {
    if (!state.polaroid) state.polaroid = { u: .8, v: .55, z: 10 };
    const node = makePolaroidNode();
    const view = { node, x: 0, y: 0 };
    polaroidView = view;
    const p = state.polaroid;
    node.addEventListener("pointerdown", e => startPolaroidGesture(e, p, view));
    node.addEventListener("pointermove", movePolaroidGesture);
    node.addEventListener("pointerup", e => {
      if (!polaroidActive || polaroidActive.pointerId !== e.pointerId) return;
      movePolaroidGesture(e);
      finishPolaroidGesture(true);
    });
    node.addEventListener("pointercancel", e => {
      if (polaroidActive && polaroidActive.pointerId === e.pointerId) finishPolaroidGesture(false);
    });
    node.addEventListener("lostpointercapture", e => {
      if (polaroidActive && polaroidActive.pointerId === e.pointerId) finishPolaroidGesture(false);
    });
    node.addEventListener("click", e => e.preventDefault());
    node.addEventListener("keydown", e => {
      if (dialog.open || polaroidActive || active) return;
      if ((e.key === "Enter" || e.key === " ") && !e.repeat) {
        e.preventDefault();
        showPolaroid();
      }
    });
    canvas.append(node);
    layout();
  }

  function flipPolaroid() {
    if (!polaroidCardEl) return;
    polaroidSide = polaroidSide === "front" ? "back" : "front";
    polaroidCardEl.classList.toggle("flipped", polaroidSide === "back");
  }

  function showPolaroid() {
    const scene = el("div", "flip-scene");
    const card = el("div", "flip-card");
    polaroidCardEl = card;

    const front = el("div", "polaroid polaroid-static flip-face flip-front");
    front.append(
      el("div", "polaroid-photo", "3:4 照片占位\n图片待补充"),
      el("div", "polaroid-caption", polaroidData.name)
    );

    const back = el("div", "flip-face flip-back");
    const link = el("a");
    link.href = /^https?:\/\//i.test(polaroidData.url) ? polaroidData.url : "https://" + polaroidData.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = polaroidData.url;
    back.append(
      el("h3", "", polaroidData.name),
      el("p", "", polaroidData.intro),
      link,
      el("p", "flip-hint", "点击照片以外的空白处可翻回正面")
    );
    card.append(front, back);
    scene.append(card);

    card.addEventListener("click", e => {
      if (polaroidClosing) return;
      if (e.target.closest("a")) return;
      flipPolaroid();
    });

    polaroidSide = "front";
    polaroidClosing = false;
    polaroidModalActive = true;
    dialog.classList.add("no-scroll");
    openModal("拍立得", scene, null);

    // 打开 0.5 秒后自动翻到背面。
    polaroidFlipTimer = setTimeout(() => {
      if (polaroidModalActive) flipPolaroid();
    }, 500);
  }

  function requestClose() {
    if (polaroidModalActive && polaroidSide === "back" && !polaroidClosing) {
      polaroidClosing = true;
      flipPolaroid();
      polaroidCloseTimer = setTimeout(() => {
        polaroidClosing = false;
        closeModal();
      }, 660);
      return;
    }
    if (polaroidClosing) return;
    closeModal();
  }

  function renderNotes() {
    canvas.replaceChildren();
    views.clear();
    state.notes.forEach(mountNote);
    layout();
  }

  function arrangeNotes() {
    if (active) finishGesture(false);
    const d = dimensions();
    const cols = Math.max(1, Math.floor((d.cw - d.pad * 2 + 24) / (d.width + 24)));
    const rows = Math.max(1, Math.ceil(state.notes.length / cols));
    state.canvasMinHeight = Math.max(600, rows * (174 + 26) + 26);
    canvas.style.minHeight = state.canvasMinHeight + "px";
    state.notes.forEach(n => { n.u = null; n.v = null; });
    layout();
    toast("便签已经排好，仍然可以随意拖动。");
  }

  function showNewNote() {
    const form = el("form");
    const label = el("label", "field-label", "今天想记住什么？");
    label.htmlFor = "newNoteText";
    const textarea = el("textarea");
    textarea.id = "newNoteText";
    textarea.maxLength = 300;
    textarea.placeholder = "写下一个小计划，或一句想送给自己的话……";
    textarea.setAttribute("aria-describedby", "noteTextCount newNoteError");

    const counters = el("div", "counter-row");
    const count = el("span", "", "0 / 300");
    count.id = "noteTextCount";
    counters.append(el("span", "", "支持换行，长内容可在放大后完整查看"), count);

    const options = el("fieldset", "color-options");
    options.append(el("legend", "", "挑一张喜欢的纸"));
    Object.entries(COLORS).forEach(([key, color], index) => {
      const option = el("label", "color-option");
      option.style.backgroundColor = color.paper;
      const input = el("input");
      input.type = "radio";
      input.name = "noteColor";
      input.value = key;
      input.checked = index === 0;
      option.append(input, document.createTextNode(color.name));
      options.append(option);
    });

    const error = el("p", "form-error");
    error.id = "newNoteError";
    error.setAttribute("role", "alert");

    textarea.addEventListener("input", () => {
      count.textContent = textarea.value.length + " / 300";
      error.textContent = "";
      textarea.removeAttribute("aria-invalid");
    });

    const actions = el("div", "form-actions");
    const cancel = button("取消", "", closeModal);
    const create = button("创建便签", "primary");
    create.type = "submit";
    actions.append(cancel, create);
    form.append(label, textarea, counters, options, error, actions);

    form.addEventListener("submit", e => {
      e.preventDefault();
      if (!textarea.value.trim()) {
        error.textContent = "先写下一点内容吧，哪怕只是一句“今天很好”。";
        textarea.setAttribute("aria-invalid", "true");
        textarea.focus();
        return;
      }
      if (textarea.value.length > 300) {
        error.textContent = "这张小纸最多容纳 300 字，请稍微精简一下。";
        return;
      }
      const color = form.querySelector('input[name="noteColor"]:checked').value;
      const offset = (state.notes.length % 5 - 2) * .045;
      const note = {
        id: "note-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8),
        text: textarea.value,
        color,
        u: clamp(.5 + offset, 0, 1),
        v: clamp(.45 + offset, 0, 1),
        z: ++highestZ
      };
      state.notes.push(note);
      mountNote(note, state.notes.length - 1);
      layout();
      closeModal();
      toast("新的小纸条已贴上。记得导出，保存这份生活板。");
    });
    openModal("＋ 新增一张便签", form, $("addButton"), textarea);
  }

  function readFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = () => reject(new Error("读取失败，请重新选择图片。"));
      reader.onabort = () => reject(new Error("图片读取已取消。"));
      reader.readAsDataURL(file);
    });
  }

  function decodeImage(data) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error("无法识别这张图片，请使用 PNG、JPG、WebP、GIF 或 BMP。"));
      image.src = data;
    });
  }

  async function loadLocalImage(file) {
    if (!file) throw new Error("没有选中图片。");
    const mimeOK = /^image\/(png|jpeg|webp|gif|bmp|x-ms-bmp)$/i.test(file.type);
    const extensionOK = /\.(png|jpe?g|webp|gif|bmp)$/i.test(file.name);
    if (!(mimeOK || (!file.type && extensionOK))) {
      throw new Error("请选择 PNG、JPG、WebP、GIF 或 BMP 图片；不使用 SVG 外部资源。");
    }
    if (file.size > 20 * 1024 * 1024) {
      throw new Error("这张图片超过 20 MB，请选择较小的图片。");
    }
    const data = await readFile(file);
    const image = await decodeImage(data);
    if (!image.naturalWidth || !image.naturalHeight ||
        image.naturalWidth * image.naturalHeight > 40000000) {
      throw new Error("图片尺寸过大或无效，请选择不超过 4000 万像素的图片。");
    }
    return { data, image };
  }

  function removeEdgeWhite(context, width, height) {
    // 只从图像外边缘漫水清除近白色像素，不全图抠白。
    // 棕色纸边会阻止漫水进入纸张内部，保护浅色纸张。
    const imageData = context.getImageData(0, 0, width, height);
    const pixels = imageData.data;
    const seen = new Uint8Array(width * height);
    const queue = new Int32Array(width * height);
    let head = 0;
    let tail = 0;

    function visit(index) {
      if (seen[index]) return;
      seen[index] = 1;
      const p = index * 4;
      const nearWhite = pixels[p] >= 247 &&
                        pixels[p + 1] >= 247 &&
                        pixels[p + 2] >= 247;
      if (pixels[p + 3] === 0 || nearWhite) queue[tail++] = index;
    }

    for (let x = 0; x < width; x++) {
      visit(x);
      visit((height - 1) * width + x);
    }
    for (let y = 0; y < height; y++) {
      visit(y * width);
      visit(y * width + width - 1);
    }

    while (head < tail) {
      const index = queue[head++];
      pixels[index * 4 + 3] = 0;
      const x = index % width;
      const y = Math.floor(index / width);
      if (x > 0) visit(index - 1);
      if (x + 1 < width) visit(index + 1);
      if (y > 0) visit(index - width);
      if (y + 1 < height) visit(index + width);
    }
    context.putImageData(imageData, 0, 0);
  }

  function cropSchedule(image, clearWhite) {
    // 素材 B 原合集参考尺寸 2048 × 1152。
    // 仅截取左上“本周日程”长纸，比例坐标兼容等比缩放后的合集。
    const sourceX = Math.round(image.naturalWidth * 124 / 2048);
    const sourceY = Math.round(image.naturalHeight * 118 / 1152);
    const sourceW = Math.round(image.naturalWidth * 383 / 2048);
    const sourceH = Math.round(image.naturalHeight * 500 / 1152);
    const scale = Math.min(1, 1000 / Math.max(sourceW, sourceH));
    const out = document.createElement("canvas");
    out.width = Math.max(1, Math.round(sourceW * scale));
    out.height = Math.max(1, Math.round(sourceH * scale));
    const context = out.getContext("2d", { willReadFrequently: true });
    if (!context) throw new Error("浏览器无法创建裁切画布。");
    context.imageSmoothingEnabled = false;
    context.drawImage(
      image, sourceX, sourceY, sourceW, sourceH,
      0, 0, out.width, out.height
    );
    if (clearWhite) removeEdgeWhite(context, out.width, out.height);
    return out.toDataURL("image/png");
  }

  function showMaterials() {
    const draft = { ...state.assets };
    const wrap = el("div");
    wrap.append(el("p", "material-intro",
      "图片只在本机通过 FileReader 读取，不会上传。初始纸张是 CSS 替代绘制；导入后点击“应用素材”，再导出，即可得到真正内嵌图片的单文件网页。"
    ));

    let pending = 0;
    const apply = button("应用素材", "primary");
    const generalStatus = el("p", "form-error");
    generalStatus.setAttribute("role", "status");

    const configs = [
      {
        key: "schedule",
        title: "素材 B · 日程与彩色便签合集",
        description: "请选择完整合集，而不是单独纸张。内置预设会按原图比例，仅裁切左上角“本周日程”。右侧彩色便签仍由 CSS 绘制。"
      },
      {
        key: "calendar",
        title: "素材 C · 黑白像素月历",
        description: "完整保留原图比例，不添加第二套日期。它始终是一张静态装饰月历。"
      }
    ];

    configs.forEach(config => {
      const section = el("section", "material-block");
      section.append(el("h3", "", config.title), el("p", "", config.description));
      const input = el("input");
      input.type = "file";
      input.accept = "image/png,image/jpeg,image/webp,image/gif,image/bmp";
      input.setAttribute("aria-label", "选择" + config.title);
      const preview = el("img", "material-preview");
      preview.alt = config.key === "schedule" ? "单独裁切后的本周日程预览" : config.title + "预览";
      preview.draggable = false;
      if (draft[config.key]) preview.src = draft[config.key];

      const status = el("p", "material-status",
        draft[config.key] ? "已有内嵌素材。" : "目前使用 CSS 替代绘制。");
      status.setAttribute("aria-live", "polite");
      const controls = el("div", "material-controls");
      const reset = button("使用 CSS 替代", "", () => {
        draft[config.key] = "";
        preview.removeAttribute("src");
        input.value = "";
        loadedScheduleImage = null;
        status.textContent = "应用后将使用 CSS 替代绘制。";
      });
      controls.append(reset);

      let clearWhite = null;
      let loadedScheduleImage = null;

      if (config.key === "schedule") {
        const label = el("label", "check-label");
        clearWhite = el("input");
        clearWhite.type = "checkbox";
        clearWhite.checked = true;
        label.append(clearWhite, document.createTextNode(" 仅去除与外缘连通的近白色背景"));
        controls.prepend(label);
        clearWhite.addEventListener("change", () => {
          if (!loadedScheduleImage) {
            status.textContent = "请重新选择素材 B 后应用此去白设置。";
            return;
          }
          try {
            draft.schedule = cropSchedule(loadedScheduleImage, clearWhite.checked);
            preview.src = draft.schedule;
            status.textContent = clearWhite.checked
              ? "已重新裁切，并清理外缘白底。请检查预览。"
              : "已重新裁切，保留原有白底。";
          } catch (error) {
            status.textContent = error.message;
          }
        });
      }

      input.addEventListener("change", async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        pending++;
        apply.disabled = true;
        input.disabled = true;
        reset.disabled = true;
        if (clearWhite) clearWhite.disabled = true;
        status.textContent = "正在本地读取，请稍等……";
        generalStatus.textContent = "";
        try {
          const loaded = await loadLocalImage(file);
          if (config.key === "schedule") {
            const ratio = loaded.image.naturalWidth / loaded.image.naturalHeight;
            if (Math.abs(ratio - 2048 / 1152) > .15) {
              throw new Error("图片比例不像素材 B 的完整合集。请选择你提供的横向完整合集，或保留 CSS 日程纸。");
            }
            loadedScheduleImage = loaded.image;
            draft.schedule = cropSchedule(loaded.image, clearWhite.checked);
            preview.src = draft.schedule;
            status.textContent = "已单独取出左上长纸，请确认预览中只有“本周日程”。";
          } else {
            draft[config.key] = loaded.data;
            preview.src = loaded.data;
            status.textContent = "已在本地读取，等待应用。";
          }
        } catch (error) {
          status.textContent = error.message || "处理失败，请重新选择。";
        } finally {
          pending--;
          input.disabled = false;
          reset.disabled = false;
          if (clearWhite) clearWhite.disabled = false;
          apply.disabled = pending > 0;
        }
      });

      section.append(input, preview, status, controls);
      wrap.append(section);
    });

    wrap.append(el("p", "notice",
      "素材 B 的预设裁切适用于你提供的同一布局合集；不适用于重新排版的其他合集。去白采用外缘连通方式，如果预览不理想，可取消去白，或继续使用完整可用的 CSS 纸张。"
    ));
    const actions = el("div", "form-actions");
    actions.append(button("取消", "", closeModal), apply);
    wrap.append(generalStatus, actions);

    apply.addEventListener("click", () => {
      if (pending) return;
      state.assets = { ...draft };
      applyAssets();
      closeModal();
      toast("素材已应用。点击“导出单文件网页”可连同图片一起保存。");
    });
    openModal("更换素材 · 全程本地", wrap, $("materialsButton"));
  }

  function exportPage() {
    if (active) finishGesture(false);
    layout();
    try {
      const snapshot = {
        version: 1,
        assets: { ...state.assets },
        canvasMinHeight: state.canvasMinHeight || 600,
        notes: state.notes.map(n => ({
          id: n.id,
          text: n.text,
          color: n.color,
          u: n.u,
          v: n.v,
          z: n.z
        })),
        polaroid: {
          u: state.polaroid.u,
          v: state.polaroid.v,
          z: state.polaroid.z
        }
      };

      const clone = document.documentElement.cloneNode(true);
      // 清除运行时副本，重新打开时由内嵌数据生成界面。
      clone.querySelector("#canvas").replaceChildren();
      clone.querySelector("#scheduleSlot").replaceChildren();
      clone.querySelector("#calendarSlot").replaceChildren();
      clone.querySelector("#modalBody").replaceChildren();
      clone.querySelector("#modal").removeAttribute("open");
      clone.querySelector("#toast").textContent = "";
      clone.querySelector("body").classList.remove("modal-open");

      // 转义尖括号，避免用户文本提前结束 JSON 脚本节点。
      clone.querySelector("#board-data").textContent = JSON.stringify(snapshot)
        .replace(/</g, "\\u003c")
        .replace(/\u2028/g, "\\u2028")
        .replace(/\u2029/g, "\\u2029");

      const html = "<!DOCTYPE html>\n" + clone.outerHTML;
      const blob = new Blob([html], { type: "text/html;charset=utf-8" });
      // Blob URL 只用于触发下载，不写入导出 HTML。
      const downloadURL = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = downloadURL;
      link.download = "index.html";
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(downloadURL), 60000);
      toast("已发起下载。新 HTML 包含当前图片、便签内容和位置。");
    } catch (error) {
      toast("导出失败，可能是图片过大或浏览器限制。请换小一些的图片后重试。");
    }
  }

  document.addEventListener("dragstart", e => {
    if (e.target.closest(".note, .polaroid, .info-item, .view-wrap, .flip-card")) e.preventDefault();
  });
  window.addEventListener("blur", () => { finishGesture(false); finishPolaroidGesture(false); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { finishGesture(false); finishPolaroidGesture(false); }
  });
  window.addEventListener("resize", queueLayout);

  canvas.style.minHeight = (state.canvasMinHeight || 600) + "px";
  applyAssets();
  renderNotes();
  mountPolaroid();

  if (typeof ResizeObserver !== "undefined") {
    const observer = new ResizeObserver(queueLayout);
    observer.observe(canvas);
  }
})();
</script>
</body>
</html>
